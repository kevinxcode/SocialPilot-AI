<!-- Simplified Facebook "Create post" dialog. AUTHOR is replaced by tests. -->
<div role="dialog" aria-label="Create post">
  <h2>Create post</h2>
  <div><span>AUTHOR</span></div>
  <div contenteditable="true" role="textbox" aria-label="What's on your mind?"></div>
  <div role="button" tabindex="0" aria-label="Photo/video"></div>
  <input type="file" accept="image/*,image/heif,image/heic,video/*" multiple style="display:none" />
  <div class="previews"></div>
  <div role="button" tabindex="0" aria-label="Post"><span>Post</span></div>
</div>
